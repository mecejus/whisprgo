name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # Superseded branch builds are worth cancelling; a release is not. Cancelling
  # main mid-run can land between `gh release delete --cleanup-tag` and
  # `gh release create`, leaving no release at all -- and install.sh resolves
  # /releases/latest, so that breaks installs until the next merge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # whisprgo is cgo against CoreGraphics/AudioToolbox, so it can only be
    # compiled on macOS. macos-latest is Apple Silicon; the guard below fails
    # loudly rather than silently shipping an x86_64 binary if that changes.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Build
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Runner is $(uname -m), expected arm64" >&2
            exit 1
          fi
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o whisprgo-darwin-arm64 .
          file whisprgo-darwin-arm64
          file whisprgo-darwin-arm64 | grep -q "arm64" || {
            echo "Built binary is not arm64" >&2; exit 1; }

      - name: Sign with the installer's recipe
        # install.sh signs the downloaded binary with a certificate it
        # creates on the user's Mac, so the Accessibility grant survives
        # upgrades. Run that exact code path here, on a throwaway keychain,
        # and check the resulting signature is what TCC will key on: our
        # identifier plus a certificate clause, identical across builds.
        run: |
          cp whisprgo-darwin-arm64 whisprgo-signed
          sh install.sh sign whisprgo-signed
          codesign --verify --verbose=2 whisprgo-signed
          codesign -dv --verbose=2 whisprgo-signed 2>&1 | tee sig.txt
          grep -q '^Identifier=com.whisprgo$' sig.txt
          grep -q '^Authority=whisprgo-local$' sig.txt

          dr=$(codesign -d -r- whisprgo-signed 2>&1 | grep '^designated')
          echo "$dr"
          echo "$dr" | grep -q 'identifier "com.whisprgo"'
          echo "$dr" | grep -q 'certificate'

          # A second, different binary signed by the same identity must get
          # the same designated requirement: that is what makes upgrades keep
          # the grant.
          cp /bin/ls other-binary
          sh install.sh sign other-binary
          dr2=$(codesign -d -r- other-binary 2>&1 | grep '^designated')
          [ "$dr" = "$dr2" ] || { echo "requirement differs: $dr2" >&2; exit 1; }

      - name: Smoke test
        # No TTY, no Accessibility grant and no microphone on the runner, so
        # the binary can't do real work here. What this does catch is a broken
        # dynamic link -- a missing framework or symbol from the cgo changes --
        # which compiling alone does not. It runs the copy the previous step
        # signed: Apple Silicon kills a binary whose signature is invalid, so
        # this is also the check that the signing recipe produces something
        # that runs.
        #
        # Deliberately no `timeout`: macOS ships no such command, and the
        # resulting 127 made an earlier version of this step pass without ever
        # running the binary.
        run: |
          mkdir -p "$HOME/.config/whisprgo"
          printf '{"api_key":"ci-smoke-test"}' > "$HOME/.config/whisprgo/config.json"

          echo "--- linked libraries ---"
          otool -L whisprgo-darwin-arm64

          echo "--- launching ---"
          ./whisprgo-signed > smoke.log 2>&1 &
          pid=$!
          sleep 10

          if kill -0 "$pid" 2>/dev/null; then
            echo "still alive after 10s (expected: parked on the Accessibility gate)"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exited=""
          else
            set +e
            wait "$pid"
            exited=$?
            set -e
            echo "exited early with code $exited"
          fi

          echo "--- output ---"
          cat smoke.log || true

          if grep -qiE "dyld|symbol not found|image not found|signal SIG|panic:" smoke.log; then
            echo "Binary failed to start cleanly" >&2
            exit 1
          fi

          # Still running is the healthy case. An early exit is only acceptable
          # if it was a deliberate one (0, or 1 from fatal() when the runner
          # has no audio device); anything else means it crashed.
          if [ -n "$exited" ] && [ "$exited" -ne 0 ] && [ "$exited" -ne 1 ]; then
            echo "Unexpected exit code $exited" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: whisprgo-darwin-arm64
          path: whisprgo-darwin-arm64
          if-no-files-found: error
          retention-days: 14


  build-windows:
    # The Windows half is pure Go — no cgo, so nothing here needs a C
    # toolchain and both architectures cross-compile from one runner. What
    # this job is really for is typechecking: the darwin and windows files
    # are mutually exclusive by build tag, so the macOS job above never
    # compiles a line of the code below, and this one never compiles a line
    # of the code above.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt is not repeated here: it ignores build tags, so the macOS job's
      # `gofmt -l .` already covers every file in the repository.
      - name: Vet
        run: go vet ./...

      - name: Test
        # The FLAC round-trip tests look for an external decoder and skip
        # when there is none; the macOS job runs them against afconvert.
        run: go test ./... -v

      - name: Build
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags="-s -w" -o whisprgo-windows-amd64.exe .
          $env:GOARCH = 'arm64'
          go build -trimpath -ldflags="-s -w" -o whisprgo-windows-arm64.exe .
          Get-ChildItem whisprgo-windows-*.exe | Format-Table Name, Length

      - name: Check the installer scripts parse
        # install.ps1 is the one part of this that cannot be compiled, and a
        # syntax error in it would only show up on a user's PC. PowerShell's
        # own parser settles it here instead.
        run: |
          $failed = $false
          foreach ($file in 'install.ps1', 'uninstall.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "$file has $($errors.Count) parse error(s):"
              $errors | ForEach-Object { Write-Host "  $_" }
              $failed = $true
            } else {
              Write-Host "$file parses cleanly"
            }
          }
          if ($failed) { exit 1 }

      - name: Smoke test
        # Windows asks for no Accessibility grant, so unlike the macOS smoke
        # test this one gets all the way to the ready line: config, WASAPI
        # setup, the chime files, and the low-level keyboard hook all have to
        # work for it to print. The runner has no microphone, which is the
        # one thing that is allowed to fail — Prime reports it and carries on,
        # exactly as it does at a user's login before the device enumerates.
        run: |
          $ErrorActionPreference = 'Continue'
          $cfg = Join-Path $env:USERPROFILE '.config\whisprgo'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          '{"api_key":"ci-smoke-test"}' | Set-Content -Path (Join-Path $cfg 'config.json') -Encoding ascii

          Write-Host '--- launching ---'
          $proc = Start-Process -FilePath .\whisprgo-windows-amd64.exe `
            -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err -PassThru
          Start-Sleep -Seconds 10

          $exited = $null
          if ($proc.HasExited) {
            $exited = $proc.ExitCode
            Write-Host "exited early with code $exited"
          } else {
            Write-Host 'still alive after 10s (expected: parked on the hotkey)'
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

          Write-Host '--- stdout ---'
          $stdoutText = if (Test-Path smoke.out) { Get-Content smoke.out -Raw } else { '' }
          Write-Host $stdoutText
          Write-Host '--- stderr ---'
          # Not $err: PowerShell variable names are case-insensitive, so that
          # would overwrite the automatic $Error collection.
          $stderrText = if (Test-Path smoke.err) { Get-Content smoke.err -Raw } else { '' }
          Write-Host $stderrText

          $all = "$stdoutText`n$stderrText"
          if ($all -match 'panic:|fatal error:|Exception 0x|runtime: ') {
            Write-Host 'Binary failed to start cleanly'
            exit 1
          }
          if ($null -ne $exited) {
            Write-Host "Expected the binary to still be running, but it exited with $exited"
            exit 1
          }
          if ($all -notmatch 'whisprgo ready') {
            Write-Host 'Binary never reported ready'
            exit 1
          }
          Write-Host 'Smoke test passed.'

      - uses: actions/upload-artifact@v4
        with:
          name: whisprgo-windows
          path: whisprgo-windows-*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build, build-windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: whisprgo-darwin-arm64

      - uses: actions/download-artifact@v4
        with:
          name: whisprgo-windows

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x whisprgo-darwin-arm64
          short=$(git rev-parse --short "$GITHUB_SHA")

          # Replace the rolling release so its source archive matches the
          # binary. install.sh resolves /releases/latest, which follows it.
          gh release delete rolling-release --yes --cleanup-tag || true

          for attempt in 1 2 3; do
            if gh release create rolling-release \
                 whisprgo-darwin-arm64 \
                 whisprgo-windows-amd64.exe \
                 whisprgo-windows-arm64.exe \
                 --title "Whispr Go" \
                 --target "$GITHUB_SHA" \
                 --notes "Built from commit \`$short\`."; then
              exit 0
            fi
            echo "Release create failed (attempt $attempt); the deleted tag may"
            echo "not have propagated yet. Retrying..."
            sleep $((attempt * 5))
          done
          echo "Could not publish release" >&2
          exit 1
